<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title">
<title id="screen-title">login / loading_naver — 저충실도 검토</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<g id="block-0" data-type="text"><text x="24" y="64" font-family="sans-serif" font-size="14" fill="#222222">곤충맵</text></g>
<g id="block-1" data-type="text"><text x="24" y="104" font-family="sans-serif" font-size="14" fill="#222222">작은 발견을 사진으로, 지도에.</text></g>
<g id="block-2" data-type="text"><text x="24" y="132" font-family="sans-serif" font-size="14" fill="#222222">곤충을 사진과 위치로 기록하고</text></g>
<g id="block-3" data-type="text"><text x="24" y="156" font-family="sans-serif" font-size="14" fill="#222222">함께 나눠요.</text></g>
<g id="block-4" data-type="image"><rect x="16" y="180" width="358" height="80" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="24" y="202" font-family="sans-serif" font-size="14" fill="#222222">사진·지도 기록 시각 (자리표시자)</text></g>
<g id="block-5" data-type="text"><text x="24" y="300" font-family="sans-serif" font-size="14" fill="#222222">로그인 방법을 선택해 주세요</text></g>
<g id="block-6" data-type="box"><rect x="16" y="316" width="358" height="48" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="24" y="338" font-family="sans-serif" font-size="14" fill="#222222">[공식 자산 자리] 카카오 로그인</text></g>
<g id="block-7" data-type="box"><rect x="16" y="376" width="358" height="48" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="24" y="398" font-family="sans-serif" font-size="14" fill="#222222">[공식 자산 자리] 네이버 로그인</text></g>
<g id="block-8" data-type="box"><rect x="16" y="436" width="358" height="48" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="24" y="458" font-family="sans-serif" font-size="14" fill="#222222">[공식 자산 자리] Apple 로그인</text></g>
<g id="block-9" data-type="text"><text x="24" y="520" font-family="sans-serif" font-size="14" fill="#222222">네이버 로그인 요청 중…</text></g>
<g id="block-10" data-type="text"><text x="24" y="544" font-family="sans-serif" font-size="14" fill="#222222">인증 화면에서 진행을 마쳐 주세요.</text></g>
<g id="block-11" data-type="text"><text x="24" y="588" font-family="sans-serif" font-size="14" fill="#222222">인증 화면에서 취소하면 여기로 돌아와요.</text></g>
<g id="block-12" data-type="box"><rect x="16" y="644" width="358" height="44" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="24" y="666" font-family="sans-serif" font-size="14" fill="#222222">이용약관 · 미연결 (검토용 위치)</text></g>
<g id="block-13" data-type="box"><rect x="16" y="700" width="358" height="44" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="24" y="722" font-family="sans-serif" font-size="14" fill="#222222">개인정보 처리방침 · 미연결 (검토용)</text></g>
</svg>
